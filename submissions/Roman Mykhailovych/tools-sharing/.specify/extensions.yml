# Spec Kit extension hooks — read by the speckit-* commands (see e.g.
# .claude/skills/speckit-implement/SKILL.md, "Mandatory Post-Execution Hooks").
# A hook's `command` maps to a slash command by replacing dots with hyphens:
# speckit.green.gate -> /speckit-green-gate (.claude/skills/speckit-green-gate).
installed: []

settings:
  auto_execute_hooks: true

hooks:
  after_implement:
    # Independent post-implement gate: tests + Constitution II module-boundary
    # audit decide "done" by exit code (scripts/speckit-gate.ps1 ->
    # scripts/fix-until-green.ps1), instead of /speckit-implement's self-report.
    - extension: green-gate
      command: speckit.green.gate
      enabled: true
      optional: false
      prompt: Run the test + module-boundary gate on this feature's test projects
      description: Runs scripts/fix-until-green.ps1 on every test project in tasks.md; zero agent cost when already green, bounded src/-only fixing when red
      condition: null
    # Then an independent code review (maker != checker): a read-only subagent
    # checks the diff against the constitution and spec.md requirement IDs.
    # Skipped automatically when the gate above failed. Spec Kit has no
    # built-in code-review step (checked through 1.0.12).
    - extension: code-review
      command: speckit.code.review
      enabled: true
      optional: false
      prompt: Review this feature's changes against the constitution and spec before commit/PR
      description: Runs the toolshare-reviewer subagent (.claude/agents) on the diff vs main and saves the report under reviews/
      condition: null

  after_converge:
    # Final browser acceptance, once, at the very end (after the gate, review
    # fixes and converge): the Playwright suite starts the whole app, so it
    # never runs inside the gate or its fix loops. Check-only; skipped when the
    # feature touches no Blazor code; refused while tasks are open or the gate
    # isn't PASS for the current working tree.
    - extension: e2e-check
      command: speckit.e2e.check
      enabled: true
      optional: false
      prompt: Run the browser E2E suite once as the final acceptance before commit/PR
      description: Runs scripts/speckit-e2e.ps1 (test/ToolShare.E2E.Tests, Playwright) once; traces + screenshots of failed tests under green-runs/<timestamp>-e2e/
      condition: null
